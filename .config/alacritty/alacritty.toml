import = ["/home/kode/.config/alacritty/alacritty-theme/themes/iterm.toml"]

[colors.primary]
background = '#1d1f21' ## default black
#foreground = '#fffbf6'

[font]
size = 9.5 
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

[window]
dynamic_title = false
opacity = 0.8
title = "RTFM"

[cursor]
style = { shape = "Block" }
#style = { shape = "Bean" }
vi_mode_style = { shape = "Block" }

[scrolling]
history = 5000

[keyboard]
bindings = [
  { key = "F", mods = "Control|Shift", action = "ToggleFullscreen" },
]

[env]
WINIT_X11_SCALE_FACTOR = "1.66"
