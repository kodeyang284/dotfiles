import = ["/home/kode/.config/alacritty/alacritty-theme/themes/iterm.toml"]

[colors.primary]
background = '#1d1f21' ## default black
#foreground = '#fffbf6'

[font]
size = 10.25  

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[window]
dynamic_title = true
opacity = 0.8 
title = "Alacritty"

[cursor.style]
shape = "Block"
#shape = "Beam"

[cursor.vi_mode_style]
shape = "Block"
